name: Validate Skill

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Skill package
        run: python scripts/validate_skill.py .
      - name: Compile sample prompt
        run: python scripts/compile_prompt.py assets/examples/sample-shot-map.json --mode complete --lang both > /tmp/sample-output.md
      - name: Package Skill
        run: python scripts/package_skill.py . --out /tmp/storyboard-video-director.zip
